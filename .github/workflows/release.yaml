name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Build and Push Release (${{ matrix.ha_arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - ha_arch: amd64
            docker_arch: amd64
          - ha_arch: aarch64
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse release tag
        id: tag
        run: |
          # Strip leading 'v' if present: v2.29.0-1 -> 2.29.0-1
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          UNPOLLER_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "unpoller_version=$UNPOLLER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: unifi-poller
          push: true
          tags: |
            ghcr.io/keirans/ha-addon-unifi-poller-${{ matrix.ha_arch }}:${{ steps.tag.outputs.version }}
          build-args: |
            UNPOLLER_VERSION=${{ steps.tag.outputs.unpoller_version }}
            TARGETARCH=${{ matrix.docker_arch }}
