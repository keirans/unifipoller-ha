name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint JSON files
        run: |
          find unifi-poller -name '*.json' -print0 | xargs -0 -I{} sh -c 'jq . "{}" > /dev/null && echo "OK: {}"'

      - name: Lint YAML files
        run: |
          pip install --quiet yamllint
          find . -name '*.yaml' -o -name '*.yml' | grep -v '.github' | grep -v 'openspec' | \
            xargs yamllint -d "{extends: default, rules: {line-length: {max: 120}}}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' unifi-poller/config.yaml | sed 's/version: *//' | tr -d '"')
          UNPOLLER_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
          echo "addon_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "unpoller_version=$UNPOLLER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: unifi-poller
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/keirans/ha-addon-unifi-poller:amd64-latest
            ghcr.io/keirans/ha-addon-unifi-poller:amd64-${{ steps.version.outputs.addon_version }}
          build-args: |
            UNPOLLER_VERSION=${{ steps.version.outputs.unpoller_version }}
